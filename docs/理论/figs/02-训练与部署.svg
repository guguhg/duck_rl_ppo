<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320">
<rect width="680" height="320" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="28" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#444441">训练时</text>

<rect x="40" y="46" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="100" y="66" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">仿真环境</text>
<text x="100" y="86" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">MuJoCo 物理</text>

<rect x="200" y="46" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="260" y="66" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#085041">obs 101 维</text>
<text x="260" y="86" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">本体状态向量</text>

<rect x="360" y="46" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="420" y="66" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#0C447C">Actor + Critic</text>
<text x="420" y="86" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">采样 + 估值</text>

<rect x="520" y="46" width="120" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="580" y="66" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#633806">action 14 维</text>
<text x="580" y="86" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#854F0B">关节目标</text>

<line x1="162" y1="74" x2="196" y2="74" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="322" y1="74" x2="356" y2="74" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="482" y1="74" x2="516" y2="74" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<path d="M580 102 L580 134 Q580 142 572 142 L108 142 Q100 142 100 134 L100 104" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="340" y="164" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">reward / done 回传，只用于算 loss，不是网络输入</text>

<text x="40" y="200" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#444441">部署时</text>

<rect x="40" y="218" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="100" y="238" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">传感器输入</text>
<text x="100" y="258" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">IMU + 关节</text>

<rect x="200" y="218" width="120" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="260" y="238" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#085041">obs 101 维</text>
<text x="260" y="258" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">分毫不变的同一套</text>

<rect x="360" y="218" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="420" y="238" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#0C447C">仅 Actor</text>
<text x="420" y="258" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">取均值，不采样</text>

<rect x="520" y="218" width="120" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="580" y="238" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#633806">action 14 维</text>
<text x="580" y="258" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#854F0B">下发到舵机</text>

<line x1="162" y1="246" x2="196" y2="246" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="322" y1="246" x2="356" y2="246" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="482" y1="246" x2="516" y2="246" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="300" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">同一个 π(a|s) 函数：训练多套 Critic 和采样，部署全拆掉</text>
</svg>
