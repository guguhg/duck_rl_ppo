<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300">
<rect width="680" height="300" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="24" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">过拟合的根因不是网络太大，是训练时见过的世界太窄</text>

<text x="180" y="54" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#993C1D">只在仿真固定条件下训练</text>
<circle cx="180" cy="160" r="62" fill="#FAECE7" stroke="#D85A30" stroke-width="1.2"/>
<text x="180" y="156" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#993C1D">见过的</text>
<text x="180" y="176" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#993C1D">世界范围</text>
<circle cx="290" cy="102" r="7" fill="#2C2C2A"/>
<text x="290" y="82" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#2C2C2A">真机条件</text>
<text x="180" y="252" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">真机落在圈外 → 策略没见过 → 直接崩</text>

<text x="500" y="54" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#0F6E56">域随机化后训练</text>
<ellipse cx="500" cy="160" rx="112" ry="82" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="500" y="156" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">摩擦、质量、延迟</text>
<text x="500" y="176" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">都在随机抖动</text>
<circle cx="540" cy="112" r="7" fill="#2C2C2A"/>
<text x="540" y="92" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#2C2C2A">真机条件</text>
<text x="500" y="262" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">真机落在圈内 → 策略见过类似世界 → 能活</text>

<line x1="330" y1="160" x2="372" y2="160" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="340" y="288" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">代价：仿真里的绝对分数会下降，但真机成功率上升。仿真分数不是目标，泛化才是</text>
</svg>
