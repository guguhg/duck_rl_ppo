<text x="340" y="272" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">高亮项 = Open Duck Mini 这只鸭子所在的位置：MLP + 强化学习(PPO) + 回归 + 策略网络</text>
