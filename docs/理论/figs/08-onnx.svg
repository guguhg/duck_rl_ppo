<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268" width="680" height="268">
<rect width="680" height="268" fill="#ffffff"/>
<defs>
<marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="30" y="30" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#444441">训练端（PC / GPU）</text>
<text x="360" y="30" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#444441">部署端（Pi Zero 2W）</text>
<line x1="340" y1="16" x2="340" y2="238" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="3 4"/>

<rect x="30" y="48" width="160" height="86" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text x="110" y="72" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#633806">PyTorch</text>
<text x="110" y="94" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#854F0B">负责训练</text>
<text x="110" y="114" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#854F0B">几百 MB + GPU</text>

<rect x="230" y="48" width="180" height="86" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="320" y="72" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#0C447C">ONNX 文件</text>
<text x="320" y="94" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">权重 + 计算图</text>
<text x="320" y="114" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#185FA5">0.84 MB</text>

<rect x="470" y="48" width="180" height="86" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="560" y="72" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#085041">onnxruntime</text>
<text x="560" y="94" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">负责推理</text>
<text x="560" y="114" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#0F6E56">几 MB C++ 库</text>

<line x1="192" y1="91" x2="226" y2="91" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>
<text x="209" y="82" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5F5E5A">导出</text>
<line x1="412" y1="91" x2="466" y2="91" stroke="#888780" stroke-width="1.5" marker-end="url(#ar2)"/>
<text x="439" y="82" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="11" fill="#5F5E5A">加载</text>

<text x="30" y="176" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="500" fill="#444441">为什么不能直接把 PyTorch 搬上树莓派</text>

<rect x="30" y="190" width="290" height="30" rx="4" fill="#FAEEDA"/>
<text x="42" y="210" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#633806">PyTorch：几百 MB + Python 解释器，启动几秒</text>

<rect x="360" y="190" width="290" height="30" rx="4" fill="#E1F5EE"/>
<text x="372" y="210" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#085041">onnxruntime：几 MB，只需前向，毫秒级</text>

<text x="30" y="248" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">同一个网络，只换了执行引擎 —— 像 C 编译出的 .o 文件，换了编译器也认；像 PDF，换了软件也能打开</text>
