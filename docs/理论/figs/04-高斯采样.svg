<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320">
<rect width="680" height="320" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="26" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Actor 输出的是一个分布，不是一个数</text>

<path d="M130 238 L150 236 L170 232 L190 225 L210 213 L230 196 L250 174 L270 149 L290 124 L310 103 L330 91 L340 90 L350 91 L370 103 L390 124 L410 149 L430 174 L450 196 L470 213 L490 225 L510 232 L530 236 L550 238 L550 240 L130 240 Z" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<line x1="60" y1="240" x2="620" y2="240" stroke="#B4B2A9" stroke-width="0.8"/>
<line x1="340" y1="80" x2="340" y2="240" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="340" y="66" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="500" fill="#0C447C">μ 均值 = 最该去的动作</text>

<line x1="270" y1="200" x2="410" y2="200" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="340" y="186" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#2C2C2A">±σ 这个关节有多不确定</text>

<circle cx="298" cy="258" r="4" fill="#D85A30"/>
<circle cx="340" cy="258" r="4" fill="#D85A30"/>
<circle cx="384" cy="258" r="4" fill="#D85A30"/>
<circle cx="318" cy="258" r="3" fill="#F0997B"/>
<circle cx="364" cy="258" r="3" fill="#F0997B"/>
<text x="400" y="262" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">训练时按分布采样出的动作</text>

<text x="340" y="286" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">部署时只取虚线那一点，不再随机撒点</text>
<text x="340" y="308" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="12" fill="#5F5E5A">σ 小 = 见识过这种局面，很确定　　σ 大 = 没见过，不敢确定</text>
</svg>
