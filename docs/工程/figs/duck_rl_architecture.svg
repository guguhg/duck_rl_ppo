<svg viewBox="0 0 680 800" width="680" height="800" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>duck_rl 全景：从 MJCF 与配置到训练、域随机化、导出与回放</title>
  <desc>五层结构：输入资产与契约、环境实现、训练（含训练完成后才追加的域随机化层）、导出、回放与验收脚本</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
    .th { font-size: 14px; font-weight: 500; fill: #1f2328; }
    .ts { font-size: 12px; fill: #4b5563; }
    .node rect { stroke-width: 1; }
    .c-blue rect { fill: #e6f1fb; stroke: #185fa5; }
    .c-gray rect { fill: #f1efe8; stroke: #5f5e5a; }
    .c-amber rect { fill: #faeeda; stroke: #854f0b; }
    .c-green rect { fill: #eaf3de; stroke: #3b6d11; }
    .c-dash rect { fill: #fdf7ef; stroke: #854f0b; stroke-dasharray: 5 4; }
    .arr { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .darr { stroke: #854f0b; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .note { font-size: 11px; fill: #8a5a12; }
  </style>


  <text class="ts" x="40" y="26" dominant-baseline="central">① 输入 · 配置 / 契约 / 资产</text>

  <g class="node c-blue">
    <rect x="40" y="38" width="144" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="112" y="58" text-anchor="middle" dominant-baseline="central" style="font-size:13px">assets/</text>
    <text class="ts" x="112" y="78" text-anchor="middle" dominant-baseline="central" style="font-size:11px">2 xml + 28 stl</text>
  </g>

  <g class="node c-blue">
    <rect x="192" y="38" width="144" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="264" y="58" text-anchor="middle" dominant-baseline="central" style="font-size:13px">constants.py</text>
    <text class="ts" x="264" y="78" text-anchor="middle" dominant-baseline="central" style="font-size:11px">53 维观测契约</text>
  </g>

  <g class="node c-blue">
    <rect x="344" y="38" width="144" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="416" y="58" text-anchor="middle" dominant-baseline="central" style="font-size:13px">config.py</text>
    <text class="ts" x="416" y="78" text-anchor="middle" dominant-baseline="central" style="font-size:11px">30 超参 + 7 个 dr_*</text>
  </g>

  <g class="node c-gray">
    <rect x="496" y="38" width="144" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="568" y="58" text-anchor="middle" dominant-baseline="central" style="font-size:13px">命令行参数</text>
    <text class="ts" x="568" y="78" text-anchor="middle" dominant-baseline="central" style="font-size:11px">num_envs / evals / no-dr</text>
  </g>

  <line x1="340" y1="96" x2="340" y2="122" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="350" y="110" dominant-baseline="central" style="font-size:11px">全部由 __init__ 读入</text>

  <text class="ts" x="40" y="138" dominant-baseline="central">② 环境 · DuckEnv 的四个入口（横排表示执行顺序，不是互相调用）</text>

  <g class="node c-blue">
    <rect x="40" y="150" width="180" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="130" y="170" text-anchor="middle" dominant-baseline="central" style="font-size:13px">__init__</text>
    <text class="ts" x="130" y="190" text-anchor="middle" dominant-baseline="central" style="font-size:11px">加载 MJCF + keyframe</text>
  </g>

  <g class="node c-blue">
    <rect x="240" y="150" width="180" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="330" y="170" text-anchor="middle" dominant-baseline="central" style="font-size:13px">reset</text>
    <text class="ts" x="330" y="190" text-anchor="middle" dominant-baseline="central" style="font-size:11px">造 Data + 采样指令</text>
  </g>

  <g class="node c-amber">
    <rect x="440" y="150" width="180" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="530" y="170" text-anchor="middle" dominant-baseline="central" style="font-size:13px">step</text>
    <text class="ts" x="530" y="190" text-anchor="middle" dominant-baseline="central" style="font-size:11px">映射→10 子步→观测</text>
  </g>

  <line x1="220" y1="179" x2="236" y2="179" class="arr" marker-end="url(#arrow)"/>
  <line x1="420" y1="179" x2="436" y2="179" class="arr" marker-end="url(#arrow)"/>

  <line x1="530" y1="208" x2="530" y2="222" class="arr" marker-end="url(#arrow)"/>
  <line x1="110" y1="222" x2="574" y2="222" stroke="#94a3b8" stroke-width="0.5" fill="none"/>
  <line x1="110" y1="222" x2="110" y2="232" stroke="#94a3b8" stroke-width="0.5" fill="none"/>
  <line x1="264" y1="222" x2="264" y2="232" stroke="#94a3b8" stroke-width="0.5" fill="none"/>
  <line x1="418" y1="222" x2="418" y2="232" stroke="#94a3b8" stroke-width="0.5" fill="none"/>
  <line x1="574" y1="222" x2="574" y2="232" stroke="#94a3b8" stroke-width="0.5" fill="none"/>

  <g class="node c-green">
    <rect x="40" y="232" width="140" height="52" rx="8" stroke-width="0.5"/>
    <text class="ts" x="110" y="250" text-anchor="middle" dominant-baseline="central" style="font-size:12px">_get_obs</text>
    <text class="ts" x="110" y="268" text-anchor="middle" dominant-baseline="central" style="font-size:11px">拼 53 维</text>
  </g>

  <g class="node c-green">
    <rect x="196" y="232" width="140" height="52" rx="8" stroke-width="0.5"/>
    <text class="ts" x="266" y="250" text-anchor="middle" dominant-baseline="central" style="font-size:12px">_reward</text>
    <text class="ts" x="266" y="268" text-anchor="middle" dominant-baseline="central" style="font-size:11px">八项加权求和</text>
  </g>

  <g class="node c-green">
    <rect x="352" y="232" width="140" height="52" rx="8" stroke-width="0.5"/>
    <text class="ts" x="422" y="250" text-anchor="middle" dominant-baseline="central" style="font-size:12px">_get_termination</text>
    <text class="ts" x="422" y="268" text-anchor="middle" dominant-baseline="central" style="font-size:11px">高度 / 倾角 / NaN</text>
  </g>

  <g class="node c-green">
    <rect x="508" y="232" width="132" height="52" rx="8" stroke-width="0.5"/>
    <text class="ts" x="574" y="250" text-anchor="middle" dominant-baseline="central" style="font-size:12px">rewards.py</text>
    <text class="ts" x="574" y="268" text-anchor="middle" dominant-baseline="central" style="font-size:11px">8 个纯函数</text>
  </g>

  <line x1="340" y1="336" x2="340" y2="290" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="352" y="314" dominant-baseline="central" style="font-size:11px">每 20 ms 调一次 env.step()</text>

  <text class="ts" x="40" y="326" dominant-baseline="central">③ 训练 · train.py + brax</text>

  <g class="node c-blue">
    <rect x="40" y="338" width="150" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="115" y="358" text-anchor="middle" dominant-baseline="central" style="font-size:13px">main()</text>
    <text class="ts" x="115" y="378" text-anchor="middle" dominant-baseline="central" style="font-size:11px">DuckEnv + 心跳线程</text>
  </g>

  <g class="node c-gray">
    <rect x="214" y="338" width="210" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="319" y="358" text-anchor="middle" dominant-baseline="central" style="font-size:13px">ppo.train</text>
    <text class="ts" x="319" y="378" text-anchor="middle" dominant-baseline="central" style="font-size:11px">epoch→step→actor 三层 scan</text>
  </g>

  <g class="node c-amber">
    <rect x="452" y="338" width="188" height="58" rx="8" stroke-width="0.5"/>
    <text class="ts" x="546" y="356" text-anchor="middle" dominant-baseline="central" style="font-size:12px">checkpoints/</text>
    <text class="ts" x="546" y="372" text-anchor="middle" dominant-baseline="central" style="font-size:11px">params_*.pkl</text>
    <text class="ts" x="546" y="387" text-anchor="middle" dominant-baseline="central" style="font-size:10px">每轮 eval 存一次</text>
  </g>

  <line x1="190" y1="367" x2="210" y2="367" class="arr" marker-end="url(#arrow)"/>
  <line x1="424" y1="367" x2="448" y2="367" class="arr" marker-end="url(#arrow)"/>

  <text class="ts" x="40" y="438" dominant-baseline="central">③b 域随机化 · 训练全部跑完之后才追加的一层（第 9 轮）</text>

  <rect x="40" y="450" width="408" height="78" rx="8" fill="#fdf7ef" stroke="#854f0b" stroke-width="1" stroke-dasharray="5 4"/>

  <g class="node c-dash">
    <rect x="50" y="460" width="190" height="58" rx="6" stroke-width="0.8"/>
    <text class="ts" x="145" y="480" text-anchor="middle" dominant-baseline="central" style="font-size:12px">randomize.py</text>
    <text class="ts" x="145" y="501" text-anchor="middle" dominant-baseline="central" style="font-size:11px">7 个字段 → 每环境一份</text>
  </g>

  <g class="node c-dash">
    <rect x="250" y="460" width="188" height="58" rx="6" stroke-width="0.8"/>
    <text class="ts" x="344" y="480" text-anchor="middle" dominant-baseline="central" style="font-size:12px">config.py 的 dr_*</text>
    <text class="ts" x="344" y="501" text-anchor="middle" dominant-baseline="central" style="font-size:11px">摩擦 / 质量 / kp / 力限</text>
  </g>

  <line x1="319" y1="450" x2="319" y2="400" class="darr" marker-end="url(#arrow)"/>
  <text class="note" x="310" y="420" text-anchor="end" dominant-baseline="central">randomization_fn</text>

  <text class="note" x="40" y="544" dominant-baseline="central">注：只在 train.py 接线；env.py / rewards.py / constants.py / export_onnx.py 一行未改</text>

  <line x1="546" y1="396" x2="546" y2="570" stroke="#94a3b8" stroke-width="0.5" fill="none"/>
  <line x1="546" y1="570" x2="250" y2="570" stroke="#94a3b8" stroke-width="0.5" fill="none"/>
  <line x1="250" y1="570" x2="250" y2="586" class="arr" marker-end="url(#arrow)"/>

  <text class="ts" x="40" y="582" dominant-baseline="central">④ 导出 · 参数 → ONNX</text>

  <g class="node c-blue">
    <rect x="150" y="594" width="200" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="250" y="614" text-anchor="middle" dominant-baseline="central" style="font-size:13px">export_onnx.py</text>
    <text class="ts" x="250" y="634" text-anchor="middle" dominant-baseline="central" style="font-size:11px">归一化 + 4 层 MLP + tanh</text>
  </g>

  <g class="node c-amber">
    <rect x="400" y="594" width="150" height="58" rx="8" stroke-width="0.5"/>
    <text class="th" x="475" y="614" text-anchor="middle" dominant-baseline="central" style="font-size:13px">policy.onnx</text>
    <text class="ts" x="475" y="634" text-anchor="middle" dominant-baseline="central" style="font-size:11px">对齐 &lt; 1e-4</text>
  </g>

  <line x1="350" y1="623" x2="396" y2="623" class="arr" marker-end="url(#arrow)"/>

  <line x1="475" y1="652" x2="475" y2="668" stroke="#94a3b8" stroke-width="0.5" fill="none"/>
  <line x1="130" y1="668" x2="475" y2="668" stroke="#94a3b8" stroke-width="0.5" fill="none"/>
  <line x1="130" y1="668" x2="130" y2="682" class="arr" marker-end="url(#arrow)"/>
  <line x1="330" y1="668" x2="330" y2="682" class="arr" marker-end="url(#arrow)"/>

  <text class="ts" x="40" y="696" dominant-baseline="central">⑤ 使用 · 回放与验收</text>

  <g class="node c-blue">
    <rect x="40" y="708" width="180" height="58" rx="8" stroke-width="0.5"/>
    <text class="ts" x="130" y="728" text-anchor="middle" dominant-baseline="central" style="font-size:12px">watch_policy.py</text>
    <text class="ts" x="130" y="746" text-anchor="middle" dominant-baseline="central" style="font-size:11px">CPU 回放 / 窗口 / 视频</text>
  </g>

  <g class="node c-blue">
    <rect x="240" y="708" width="180" height="58" rx="8" stroke-width="0.5"/>
    <text class="ts" x="330" y="728" text-anchor="middle" dominant-baseline="central" style="font-size:12px">check_policy_mjx.py</text>
    <text class="ts" x="330" y="746" text-anchor="middle" dominant-baseline="central" style="font-size:11px">MJX 内测真实速度</text>
  </g>

  <g class="node c-gray">
    <rect x="440" y="708" width="200" height="58" rx="8" stroke-width="0.5"/>
    <text class="ts" x="540" y="728" text-anchor="middle" dominant-baseline="central" style="font-size:12px">其余 check_*.py × 8</text>
    <text class="ts" x="540" y="746" text-anchor="middle" dominant-baseline="central" style="font-size:11px">模型/观测/步/奖励/DR/六方向</text>
  </g>

  <text class="ts" x="40" y="786" dominant-baseline="central" style="font-size:11px">灰 = 外部或框架 / 蓝 = 自己写的主路径 / 橙 = 关键产物 / 绿 = env 内部 / 橙虚线 = 训练完成后才加的域随机化</text>
</svg>
